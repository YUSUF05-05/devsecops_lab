version: "3.9"

# DevSecOps Lab - Part 3
# Hardened Docker Compose configuration

services:
  # ─── Flask Application ──────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devsecops-lab:latest
    container_name: lab_web
    restart: unless-stopped

    # Security: Non-root user defined in Dockerfile
    user: "1000:1000"

    # Security: Read-only filesystem with specific exceptions
    read_only: true
    tmpfs:
      - /tmp:size=50m,mode=1777
      - /app/data:size=100m

    # Security: Drop ALL capabilities, add back only what's needed
    cap_drop:
      - ALL

    # Security: Prevent privilege escalation
    security_opt:
      - no-new-privileges:true

    # Resource limits (DoS protection)
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

    # Environment: Secrets from .env file, never hardcoded
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

    ports:
      - "127.0.0.1:5000:5000"

    networks:
      - app_network

    depends_on:
      - redis

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ─── Redis (Session Store / Rate Limiter) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lab_redis
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=10m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --loglevel warning
    networks:
      - app_network
    expose:
      - "6379"

networks:
  app_network:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  app_data:
    driver: local